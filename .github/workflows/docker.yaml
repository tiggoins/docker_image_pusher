name: Docker Sync via Skopeo

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  sync:
    name: Sync Images via Skopeo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Login to Aliyun Registry
        run: |
          echo "$ALIYUN_REGISTRY_PASSWORD" | skopeo login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

      - name: Sync Images
        run: |
          set -e

          # 最大并行数
          MAX_PARALLEL=4
          running=0

          declare -A duplicate_images
          declare -A temp_map

          # ===== 第一遍：检测重名镜像 =====
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            echo "$line" | grep -q '^\s*#' && continue

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]=$name_space
            fi
          done < images.txt

          # ===== 同步函数 =====
          sync_image() {
            local line="$1"

            echo "$line" | grep -q '^\s*#' && return 0
            [[ -z "$line" ]] && return 0

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            platform_prefix=""
            [ -n "$platform" ] && platform_prefix="${platform//\//_}"

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            image_name_tag="${image_name_tag%%@*}"
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" ]] && [[ -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

            if [ -n "$platform" ]; then
              os=$(echo "$platform" | cut -d'/' -f1)
              arch=$(echo "$platform" | cut -d'/' -f2)
              echo "  [单架构] $image → $new_image (--override-os=$os --override-arch=$arch)"
              skopeo copy --override-os "$os" --override-arch "$arch" \
                "docker://${image}" "docker://${new_image}"
            else
              echo "  [多架构] $image → $new_image"
              skopeo copy --all "docker://${image}" "docker://${new_image}"
            fi

            echo "  ✓ $image_name_tag done"
          }

          # ===== 第二遍：并行同步 =====
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            echo "$line" | grep -q '^\s*#' && continue

            # 控制并发数
            while [ "$running" -ge "$MAX_PARALLEL" ]; do
              wait -n
              ((running--))
            done

            echo "[sync] $line"
            sync_image "$line" &
            ((running++))
          done < images.txt

          # 等待所有后台任务结束
          wait
          echo "All images synced!"
